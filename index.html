<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>타운빌더</title>
    <!--
      아이콘을 파일로 두지 않고 인라인 SVG로 준다. 에셋을 코드로 만든다는 규약(ADR 0009)과
      같은 결이고, 파일이 없어 404가 나던 것도 사라진다.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232f4f2f'/%3E%3Cpath d='M6 20 16 14 26 20 16 26z' fill='%23d9c39a'/%3E%3Cpath d='M16 6 27 13 16 19 5 13z' fill='%23b8563f'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- 게임 화면. 크기는 CanvasRenderer가 표시 영역에 맞춰 조정한다. -->
    <canvas id="game"></canvas>

    <!-- DOM 오버레이 UI. 캔버스 위에 얹히는 디버그/HUD 텍스트가 들어간다. -->
    <div id="overlay" class="overlay">
      <span id="fps" class="overlay__chip overlay__chip--fps">-- fps</span>
      <span id="info" class="overlay__chip">타일 (--, --)</span>
      <span id="stash" class="overlay__chip">보유 없음</span>
    </div>

    <!-- 조작 도움말. H로 열고 닫는다. HelpPanel이 내용을 만든다. -->
    <div id="help"></div>

    <!-- 저장 메뉴. SaveMenu가 내용을 만든다. -->
    <div id="save" class="save"></div>

    <!-- 마을 레벨 게이지와 1차 목표. VillageHud가 내용을 만든다. -->
    <div id="village" class="village"></div>

    <!-- 미완료 주민 요청 목록. RequestList가 내용을 만든다. -->
    <div id="requests" class="requests" hidden></div>

    <!-- 짧은 알림. Toasts가 내용을 만든다. 대사창은 만들지 않는다. -->
    <div id="toasts" class="toasts"></div>

    <!-- 건축 모드 블루프린트 목록. BuildPanel이 내용을 만든다. -->
    <div id="panel" class="panel" hidden></div>

    <!-- 하단 인벤토리 바. 슬롯은 InventoryBar가 만든다. -->
    <div id="bar" class="bar"></div>

    <!-- 조작 안내. 상황에 맞는 것만 보이도록 게임이 내용을 갱신한다. -->
    <div id="hint" class="hint">WASD: 걷기 · 1~3: 도구 · 좌클릭: 채집/파기</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
