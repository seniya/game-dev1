<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>타운빌더</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- 게임 화면. 크기는 CanvasRenderer가 표시 영역에 맞춰 조정한다. -->
    <canvas id="game"></canvas>

    <!-- DOM 오버레이 UI. 캔버스 위에 얹히는 디버그/HUD 텍스트가 들어간다. -->
    <div id="overlay" class="overlay">
      <span id="fps" class="overlay__chip overlay__chip--fps">-- fps</span>
      <span id="info" class="overlay__chip">타일 (--, --)</span>
    </div>

    <!-- 조작 안내. Phase 9의 UI 폴리싱 때 정식 HUD로 대체한다. -->
    <div class="hint">드래그: 이동 · 휠: 확대/축소</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
